<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batalha Pokémon</title>
    <link rel="stylesheet" href="./assets/styles/main.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/icon/favicon/pokebola.png"
      type="image/x-icon"
    />
  </head>
  <body>
      <audio id="battle-theme" loop>
        <source src="assets/audio/battle-theme.mpeg" type="audio/mpeg">
      </audio>
      <div class="start-screen" id="start">
        <div class="start-content">
          <img src="./assets/images/logo/pokemon-logo.gif" alt="" class="start-logo" />
          <h1 class="start-title">Batalha de Pokémon</h1>
          <button class="start-btn" id="startBtn">▶ Jogar</button>
        </div>
        <div class="scanlines"></div>
      </div>
      <div class="selection-screen hidden" id="selection-screen">
      <h2 class="selection-title">Escolha seu Pokémon!</h2>
      <div class="selection-panels">
        <div class="selection-panel">
          <h3>Seu Pokémon</h3>
          <div class="search-box">
            <input type="text" id="player-search" placeholder="Nome ou número..." maxlength="20" />
            <div class="tooltip">
              <span>Nome ou número</span>
            </div>
            <button id="player-search-btn">Buscar</button>
          </div>
          <div class="pokemon-preview" id="player-preview">
            <div class="preview-placeholder">?</div>
          </div>
        </div>
        <div class="selection-vs">VS</div>
        <div class="selection-panel">
          <h3>Oponente</h3>
          <div class="search-box">
            <input type="text" id="enemy-search" placeholder="Nome ou número..." maxlength="20" />
            <div class="tooltip">
              <span>Nome ou número</span>
            </div>
            <button id="enemy-search-btn">Buscar</button>
          </div>
          <div class="pokemon-preview" id="enemy-preview">
            <div class="preview-placeholder">?</div>
          </div>
        </div>
      </div>
      <button class="start-btn battle-start-btn" id="battle-start-btn" disabled>▶ Iniciar batalha</button>
      <div class="scanlines"></div>
    </div>
    <script src="./assets/scripts/index.js"></script>
  </body>
</html>
