<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batalha Pokémon</title>
    <link rel="stylesheet" href="./assets/styles/main.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/icon/favicon/pokebola.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <audio id="battle-theme" loop>
      <source src="assets/audio/battle-theme.mpeg" type="audio/mpeg" />
    </audio>
    <div class="start-screen" id="start">
      <div class="start-content">
        <img
          src="./assets/images/logo/pokemon-logo.gif"
          alt=""
          class="start-logo"
        />
        <h1 class="start-title">Batalha de Pokémon</h1>
        <button class="start-btn" id="start-btn">▶ Jogar</button>
      </div>
      <div class="scanlines"></div>
    </div>
    <div class="selection-screen hidden" id="selection-screen">
      <h2 class="selection-title">Escolha seu Pokémon!</h2>
      <div class="selection-panels">
        <div class="selection-panel">
          <h3>Seu Pokémon</h3>
          <div class="search-box">
            <input
              type="text"
              class="search-input"
              id="player-search"
              placeholder="Nome ou número..."
              maxlength="20"
            />
            <div id="tooltip-selection" class="tooltip">
              <span id="tooltip-text">Nome ou número</span>
            </div>
            <button
              data-tooltip="Se o campo estiver vazio, um número aleatório é escolhido."
              class="search-btn"
              id="player-search-btn"
            >
              Buscar
            </button>
          </div>
          <div class="pokemon-preview" id="player-preview">
            <div class="preview-placeholder">?</div>
          </div>
        </div>
        <div class="selection-vs">VS</div>
        <div class="selection-panel">
          <h3>Oponente</h3>
          <div class="search-box">
            <input
              type="text"
              class="search-input"
              id="enemy-search"
              placeholder="Nome ou número..."
              maxlength="20"
            />
            <div id="tooltip-selection" class="tooltip">
              <span id="tooltip-text">Nome ou número</span>
            </div>
            <button
              data-tooltip="Se o campo estiver vazio, um número aleatório é escolhido."
              class="search-btn"
              id="enemy-search-btn"
            >
              Buscar
            </button>
          </div>
          <div class="pokemon-preview" id="enemy-preview">
            <div class="preview-placeholder">?</div>
          </div>
        </div>
      </div>
      <button class="start-btn battle-start-btn" id="battle-start-btn" disabled>
        ▶ Iniciar batalha
      </button>
      <div class="scanlines"></div>
    </div>
    <main class="battle-screen hidden" id="battle-screen">
      <div class="battle-area">
        <div class="pokemon-status enemy-status" id="enemy-status">
          <span class="identificator enemy">Oponente</span>
          <div class="status-header">
            <span class="poke-name" id="enemy-name">???</span>
            <span class="poke-level">Lv <span id="enemy-level">--</span></span>
          </div>
          <div class="hp-bar-wrap">
            <span class="hp-label">HP</span>
            <div class="hp-bar-track">
              <div class="hp-bar-fill" id="enemy-hp-bar"></div>
            </div>
            <div class="hp-numbers" id="enemy-hp-numbers"></div>
          </div>
        </div>

        <div class="enemy-sprite-wrap">
          <img
            class="pokemon-sprite enemy-sprite"
            id="enemy-sprite"
            src=""
            alt="Inimigo"
          />
        </div>

        <div class="player-sprite-wrap">
          <img
            class="pokemon-sprite player-sprite"
            id="player-sprite"
            src=""
            alt="Jogador"
          />
        </div>

        <div class="pokemon-status player-status" id="player-status">
          <span class="identificator player">Jogador</span>
          <div class="status-header">
            <span class="poke-name" id="player-name">???</span>
            <span class="poke-level">Lv <span id="player-level">--</span></span>
          </div>
          <div class="hp-bar-wrap">
            <span class="hp-label">HP</span>
            <div class="hp-bar-track">
              <div class="hp-bar-fill" id="player-hp-bar"></div>
            </div>
            <div class="hp-numbers" id="player-hp-numbers"></div>
          </div>
        </div>
      </div>

      <div class="battle-panel">
        <div class="dialog-box" id="dialog-box">
          <div class="dialog-box-inner">
            <p class="dialog-text" id="dialog-text">Carregando batalha...</p>
          </div>
        </div>

        <div class="moves-menu" id="moves-menu">
          <div class="moves-grid" id="moves-grid"></div>
          <div class="move-info" id="move-info">
            <span id="move-pp">PP --/--</span>
            <span id="move-type">TIPO: ---</span>
          </div>
        </div>
      </div>
    </main>
    <script src="./assets/scripts/index.js"></script>
  </body>
</html>
